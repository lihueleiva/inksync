<mat-sidenav-container class="dashboard-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <h2>InkSync</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard/consultations">
        <mat-icon>inbox</mat-icon>
        <span>Consultas</span>
      </a>
      <a mat-list-item routerLink="/dashboard/calendar">
        <mat-icon>calendar_today</mat-icon>
        <span>Agenda</span>
      </a>
      <a mat-list-item routerLink="/dashboard/clients">
        <mat-icon>people</mat-icon>
        <span>Clientes</span>
      </a>
      <a mat-list-item routerLink="/dashboard/portfolio">
        <mat-icon>photo_library</mat-icon>
        <span>Portafolio</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary">
      <span>Panel de Artista</span>
    </mat-toolbar>
    <main class="content-wrapper">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
