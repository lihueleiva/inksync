<h2 mat-dialog-title>Añadir Nuevo Cliente</h2>

<mat-dialog-content>
  <form [formGroup]="clientForm" class="client-form">

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="firstName">
        <mat-error>El nombre es requerido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput formControlName="lastName">
        <mat-error>El apellido es requerido.</mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email">
      <mat-error>Debe ser un email válido.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono / WhatsApp</mat-label>
      <input matInput formControlName="phone" type="tel">
      <mat-error>El teléfono es requerido.</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="clientForm.invalid" (click)="onSave()">Guardar Cliente</button>
</mat-dialog-actions>
