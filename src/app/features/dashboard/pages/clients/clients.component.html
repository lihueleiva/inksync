<mat-card>
  <mat-card-header class="clients-header">
    <mat-card-title>Gestión de Clientes</mat-card-title>
    <button mat-flat-button color="primary" (click)="addClient()">
      <mat-icon>add</mat-icon>
      Añadir Cliente
    </button>
  </mat-card-header>
  <mat-card-content>

    @if (clients().length > 0) {
      <table mat-table [dataSource]="clients()" class="clients-table">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let client"> {{client.firstName}} {{client.lastName}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let client"> {{client.email}} </td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef> Teléfono </th>
          <td mat-cell *matCellDef="let client"> {{client.phone}} </td>
        </ng-container>


        <ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef> Acciones </th>
  <td mat-cell *matCellDef="let client">
    <button mat-icon-button color="primary" (click)="editClient(client)">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="deleteClient(client.id)">
      <mat-icon>delete</mat-icon>
    </button>
  </td>
</ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    } @else {
      <div classs="no-clients">
        <p>No hay clientes registrados. ¡Añade el primero!</p>
      </div>
    }

  </mat-card-content>
</mat-card>
